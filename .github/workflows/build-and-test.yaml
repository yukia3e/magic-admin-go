name: build-and-test

run-name: Test by @${{ github.actor }}

on:
  push:
    branches: [master]

  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Setup
        run: |
          go install gotest.tools/gotestsum@v1.13.0
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: .
          args: -v --timeout=10m
      - name: Build
        run: go build ./...
      - name: Test
        run: gotestsum --jsonfile tmp/test-results.json -- -timeout 20m ./...
      - name: Annotate tests
        uses: guyarb/golang-test-annotations@96fc379b171c49932041d6c789e73331a7bdeec1 # v0.9.0
        if: success() || failure() # always run even if the previous step fails
        with:
          test-results: tmp/test-results.json
